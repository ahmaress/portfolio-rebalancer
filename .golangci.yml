run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
    - gofmt

linters-settings:
  gosec:
    excludes:
      - G104 # unhandled errors are covered by errcheck with its own exclusions
  revive:
    rules:
      - name: exported
        disabled: true

issues:
  exclude-rules:
    - path: _test\.go
      linters: [gosec, errcheck, bodyclose]
